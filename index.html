<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucas & Rebeca</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #fdfaf5;
  color: #2c3e50;
}

/* CONTAINER CENTRAL */
.wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* CARD ESTILO CONVITE */
.card {
  background: white;
  max-width: 420px;
  width: 100%;
  padding: 30px 25px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.08);
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* LINHA DECORATIVA */
.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 4px;
  background: #7fa1c3;
  border-radius: 10px;
}

/* NOMES */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  margin: 10px 0;
  color: #2c4a6e;
}

/* TEXTO */
.subtitle {
  font-size: 15px;
  color: #666;
  margin-bottom: 5px;
}

.date {
  font-size: 13px;
  color: #999;
  margin-bottom: 20px;
}

/* VIDEO */
video {
  width: 100%;
  border-radius: 15px;
  border: 2px solid #e6eef6;
  background: black;
}

/* REC */
.rec-status {
  margin-top: 10px;
  color: #e74c3c;
  font-weight: 500;
  display: none;
}

.timer {
  font-size: 13px;
  color: #888;
}

/* BOTÕES */
.buttons {
  margin-top: 20px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
}

/* BOTÕES ESPECÍFICOS */
.btn-record {
  background: #7fa1c3;
  color: white;
}

.btn-stop {
  background: #f4d38c;
}

.btn-send {
  background: #2c4a6e;
  color: white;
}

/* HOVER */
button:hover {
  opacity: 0.9;
}

/* STATUS */
#status {
  margin-top: 15px;
  font-size: 14px;
}

/* RODAPÉ */
.footer {
  margin-top: 25px;
  font-size: 13px;
  color: #888;
}

</style>
</head>

<body>

<div class="wrapper">
  <div class="card">

    <h1>Lucas & Rebeca</h1>
    <p class="subtitle">Deixe uma mensagem especial</p>
    <p class="date">14 de Novembro de 2026</p>

    <video id="preview" autoplay muted></video>

    <div class="rec-status" id="recStatus">● Gravando...</div>
    <div class="timer" id="timer"></div>

    <div class="buttons">
      <button class="btn-record" onclick="startRecording()">Gravar vídeo</button>
      <button class="btn-stop" onclick="stopRecording()">Parar gravação</button>
      <button class="btn-send" onclick="uploadVideo()">Enviar mensagem</button>
    </div>

    <p id="status"></p>

    <div class="footer">
      Obrigado por fazer parte desse momento 💛
    </div>

  </div>
</div>

<script>
let mediaRecorder;
let recordedChunks = [];
let blobFinal;
let timerInterval;
let seconds = 0;

function updateTimer() {
  seconds++;
  document.getElementById("timer").innerText = seconds + "s";
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById('preview').srcObject = stream;

  recordedChunks = [];
  seconds = 0;

  document.getElementById("recStatus").style.display = "block";
  timerInterval = setInterval(updateTimer, 1000);

  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = function(e) {
    recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = function() {
    blobFinal = new Blob(recordedChunks, { type: 'video/webm' });
    clearInterval(timerInterval);
  };

  mediaRecorder.start();
}

function stopRecording() {
  mediaRecorder.stop();
  document.getElementById("recStatus").style.display = "none";
}

async function uploadVideo() {
  if (!blobFinal) {
    alert("Grave um vídeo primeiro!");
    return;
  }

  document.getElementById("status").innerText = "Enviando...";

  const formData = new FormData();
  formData.append("file", blobFinal, "video.webm");
  formData.append("upload_preset", "casamento");
  formData.append("folder", "casamento-lucas-rebeca");

  await fetch("https://api.cloudinary.com/v1_1/ddrodotaj/video/upload", {
    method: "POST",
    body: formData
  });

  document.getElementById("status").innerText = "Mensagem enviada com sucesso 💖";
}
</script>

</body>
</html>
