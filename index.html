<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucas & Rebeca</title>

<!-- Fonte elegante -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to bottom, #fff8dc, #e3edf7);
  text-align: center;
  color: #2c3e50;
  animation: fadeIn 1.5s ease;
}

/* Flores nos cantos */
body::before,
body::after {
  content: "";
  position: fixed;
  width: 150px;
  height: 150px;
  background-size: contain;
  background-repeat: no-repeat;
  opacity: 0.6;
}

body::before {
  top: 0;
  left: 0;
  background-image: url('https://png.pngtree.com/png-clipart/20221018/original/pngtree-watercolor-yellow-flowers-png-image_8702303.png');
}

body::after {
  bottom: 0;
  right: 0;
  background-image: url('https://png.pngtree.com/png-clipart/20221018/original/pngtree-blue-watercolor-flowers-png-image_8702304.png');
}

.container {
  padding: 20px;
}

/* Nome elegante */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  color: #2c4a6e;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 5px;
}

.date {
  margin-bottom: 20px;
  font-size: 14px;
  color: #555;
}

/* Moldura estilo câmera */
.camera-box {
  position: relative;
  display: inline-block;
}

video {
  width: 90%;
  max-width: 350px;
  border-radius: 20px;
  border: 4px solid #7fa1c3;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* Cantos da câmera */
.corner {
  position: absolute;
  width: 20px;
  height: 20px;
  border: 3px solid white;
}

.top-left { top: 5px; left: 5px; border-right: none; border-bottom: none; }
.top-right { top: 5px; right: 5px; border-left: none; border-bottom: none; }
.bottom-left { bottom: 5px; left: 5px; border-right: none; border-top: none; }
.bottom-right { bottom: 5px; right: 5px; border-left: none; border-top: none; }

/* REC piscando */
.rec-status {
  margin-top: 10px;
  font-weight: bold;
  color: red;
  display: none;
  animation: pulse 1s infinite;
}

.timer {
  font-size: 14px;
}

/* Botões */
button {
  padding: 14px 20px;
  margin: 8px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.btn-record {
  background: #7fa1c3;
  color: white;
}

.btn-stop {
  background: #f7d794;
}

.btn-send {
  background: #7fa1c3;
  color: white;
  width: 80%;
  max-width: 300px;
}

/* Rodapé */
.footer {
  margin-top: 30px;
  font-style: italic;
}

/* Animações */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

@keyframes pulse {
  0% {opacity: 1;}
  50% {opacity: 0.4;}
  100% {opacity: 1;}
}

</style>
</head>

<body>

<div class="container">

<h1>Lucas & Rebeca 💛</h1>
<p class="subtitle">Deixe sua mensagem ❤️</p>
<p class="date">14/11/2026</p>

<div class="camera-box">
  <video id="preview" autoplay muted></video>

  <div class="corner top-left"></div>
  <div class="corner top-right"></div>
  <div class="corner bottom-left"></div>
  <div class="corner bottom-right"></div>
</div>

<div class="rec-status" id="recStatus">🔴 Gravando...</div>
<div class="timer" id="timer"></div>

<br>

<button class="btn-record" onclick="startRecording()">🎥 Gravar</button>
<button class="btn-stop" onclick="stopRecording()">⏹ Parar</button>

<br>

<button class="btn-send" onclick="uploadVideo()">📤 Enviar vídeo</button>

<p id="status"></p>

<div class="footer">
💖 Obrigado por fazer parte desse momento especial!
</div>

</div>

<script>
let mediaRecorder;
let recordedChunks = [];
let blobFinal;
let timerInterval;
let seconds = 0;

function updateTimer() {
  seconds++;
  document.getElementById("timer").innerText = "Tempo: " + seconds + "s";
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById('preview').srcObject = stream;

  recordedChunks = [];
  seconds = 0;

  document.getElementById("recStatus").style.display = "block";
  timerInterval = setInterval(updateTimer, 1000);

  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = function(e) {
    recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = function() {
    blobFinal = new Blob(recordedChunks, { type: 'video/webm' });
    clearInterval(timerInterval);
  };

  mediaRecorder.start();
}

function stopRecording() {
  mediaRecorder.stop();
  document.getElementById("recStatus").style.display = "none";
}

async function uploadVideo() {
  if (!blobFinal) {
    alert("Grave um vídeo primeiro!");
    return;
  }

  document.getElementById("status").innerText = "Enviando...";

  const formData = new FormData();
  formData.append("file", blobFinal, "video.webm");
  formData.append("upload_preset", "casamento");
  formData.append("folder", "casamento-lucas-rebeca");

  await fetch("https://api.cloudinary.com/v1_1/ddrodotaj/video/upload", {
    method: "POST",
    body: formData
  });

  document.getElementById("status").innerText = "💖 Obrigado! Sua mensagem foi enviada com carinho!";
}
</script>

</body>
</html>
