<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucas & Rebeca</title>

<!-- Fonte elegante -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to bottom, #fff8dc, #dce6f2);
  text-align: center;
  color: #2c3e50;
  overflow-x: hidden;
}

/* FLORES FIXAS NOS CANTOS (FUNCIONA DE VERDADE) */
.flower {
  position: fixed;
  width: 120px;
  opacity: 0.8;
  z-index: 0;
}

.flower.top-left {
  top: 0;
  left: 0;
}

.flower.top-right {
  top: 0;
  right: 0;
  transform: scaleX(-1);
}

.flower.bottom-left {
  bottom: 0;
  left: 0;
  transform: scaleY(-1);
}

.flower.bottom-right {
  bottom: 0;
  right: 0;
  transform: scale(-1);
}

/* CONTEÚDO */
.container {
  position: relative;
  z-index: 1;
  padding: 20px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  color: #2c4a6e;
}

.subtitle {
  font-size: 18px;
}

.date {
  margin-bottom: 20px;
  color: #555;
}

/* VIDEO */
video {
  width: 90%;
  max-width: 320px;
  border-radius: 20px;
  border: 4px solid #7fa1c3;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  background: #000;
}

/* REC */
.rec-status {
  color: red;
  font-weight: bold;
  display: none;
  animation: pulse 1s infinite;
}

.timer {
  font-size: 14px;
}

/* BOTÕES */
button {
  padding: 14px 20px;
  margin: 8px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.btn-record {
  background: #7fa1c3;
  color: white;
}

.btn-stop {
  background: #f7d794;
}

.btn-send {
  background: #7fa1c3;
  color: white;
  width: 80%;
}

/* ANIMAÇÃO */
@keyframes pulse {
  0% {opacity: 1;}
  50% {opacity: 0.3;}
  100% {opacity: 1;}
}
</style>
</head>

<body>
<img src="https://i.imgur.com/6Iej2c3.png" class="flower top-left">
<img src="https://i.imgur.com/6Iej2c3.png" class="flower top-right">
<img src="https://i.imgur.com/6Iej2c3.png" class="flower bottom-left">
<img src="https://i.imgur.com/6Iej2c3.png" class="flower bottom-right">

<div class="container">

<h1>Lucas & Rebeca 💛</h1>
<p class="subtitle">Deixe sua mensagem ❤️</p>
<p class="date">14/11/2026</p>

<div class="camera-box">
  <video id="preview" autoplay muted></video>

  <div class="corner top-left"></div>
  <div class="corner top-right"></div>
  <div class="corner bottom-left"></div>
  <div class="corner bottom-right"></div>
</div>

<div class="rec-status" id="recStatus">🔴 Gravando...</div>
<div class="timer" id="timer"></div>

<br>

<button class="btn-record" onclick="startRecording()">🎥 Gravar</button>
<button class="btn-stop" onclick="stopRecording()">⏹ Parar</button>

<br>

<button class="btn-send" onclick="uploadVideo()">📤 Enviar vídeo</button>

<p id="status"></p>

<div class="footer">
💖 Obrigado por fazer parte desse momento especial!
</div>

</div>

<script>
let mediaRecorder;
let recordedChunks = [];
let blobFinal;
let timerInterval;
let seconds = 0;

function updateTimer() {
  seconds++;
  document.getElementById("timer").innerText = "Tempo: " + seconds + "s";
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById('preview').srcObject = stream;

  recordedChunks = [];
  seconds = 0;

  document.getElementById("recStatus").style.display = "block";
  timerInterval = setInterval(updateTimer, 1000);

  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = function(e) {
    recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = function() {
    blobFinal = new Blob(recordedChunks, { type: 'video/webm' });
    clearInterval(timerInterval);
  };

  mediaRecorder.start();
}

function stopRecording() {
  mediaRecorder.stop();
  document.getElementById("recStatus").style.display = "none";
}

async function uploadVideo() {
  if (!blobFinal) {
    alert("Grave um vídeo primeiro!");
    return;
  }

  document.getElementById("status").innerText = "Enviando...";

  const formData = new FormData();
  formData.append("file", blobFinal, "video.webm");
  formData.append("upload_preset", "casamento");
  formData.append("folder", "casamento-lucas-rebeca");

  await fetch("https://api.cloudinary.com/v1_1/ddrodotaj/video/upload", {
    method: "POST",
    body: formData
  });

  document.getElementById("status").innerText = "💖 Obrigado! Sua mensagem foi enviada com carinho!";
}
</script>

</body>
</html>
